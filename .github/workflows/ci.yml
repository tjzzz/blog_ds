name: ci
on:
  push:
    branches:
      - master
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install -r requirements.txt
      - run: python config/scripts/wiki_lint.py
      - run: mkdocs build --strict -f config/mkdocs.yml
      - run: python config/scripts/check_site_output.py
      - run: mkdocs gh-deploy --force --strict -f config/mkdocs.yml
