name: ci
on:
  push:
    branches:
      - master
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install -r requirements.txt
      - run: python config/scripts/wiki_lint.py
      - run: mkdocs build --strict -f config/mkdocs.yml
      - run: python config/scripts/check_site_output.py
      # The 资讯 tab is sourced from a folder outside the repo (../资讯),
      # which does not exist on CI. Publishing is done locally with
      # `mkdocs gh-deploy -f config/mkdocs.yml`; CI only validates and must
      # not overwrite gh-pages with a build that lacks the tab.
